name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PDF fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install pygments reportlab
      - name: Run C++ tests
        run: make test
      - name: Test PDF generator
        run: make test-code2pdf
      - name: Build combined Code + Docs PDF
        run: make pdf
      - name: Upload codebook.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: codebook-pdf
          path: codebook.pdf

  library-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification helper
        run: |
          python -m pip install --upgrade 'setuptools<81'
          python -m pip install --upgrade online-judge-verify-helper
      - name: Verify Library Checker solutions
        run: oj-verify run
